name: nightly

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      roles:
        description: 'Comma-separated roles to build (companion,repeater,room-server)'
        default: 'companion,repeater,room-server'
        type: string
      dry_run:
        description: 'Skip release creation, prune, and README update'
        default: false
        type: boolean
      branch_override:
        description: 'Upstream branch to build (overrides nightly.yml)'
        default: ''
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      upstream_repo: ${{ steps.cfg.outputs.upstream_repo }}
      upstream_branch: ${{ steps.cfg.outputs.upstream_branch }}
      upstream_sha: ${{ steps.cfg.outputs.upstream_sha }}
      upstream_sha7: ${{ steps.cfg.outputs.upstream_sha7 }}
      pr_list: ${{ steps.cfg.outputs.pr_list }}
      retention: ${{ steps.cfg.outputs.retention }}
      roles: ${{ steps.cfg.outputs.roles }}
      matrix: ${{ steps.cfg.outputs.matrix }}
      run_date: ${{ steps.cfg.outputs.run_date }}
      run_ts: ${{ steps.cfg.outputs.run_ts }}
    steps:
      - uses: actions/checkout@v5

      - name: Parse config
        id: cfg
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ROLES: ${{ inputs.roles }}
          INPUT_BRANCH: ${{ inputs.branch_override }}
        run: |
          set -euo pipefail
          REPO=$(yq -r '.upstream.repo // "meshcore-dev/MeshCore"' nightly.yml)
          BRANCH_CFG=$(yq -r '.upstream.branch // "dev"' nightly.yml)
          BRANCH="${INPUT_BRANCH:-}"
          [ -z "$BRANCH" ] && BRANCH="$BRANCH_CFG"
          PRS=$(yq -o=json -I=0 '.extra_prs // []' nightly.yml)
          RET=$(yq -r '.retention // 10' nightly.yml)
          ROLES_INPUT="${INPUT_ROLES:-companion,repeater,room-server}"
          ROLES_JSON=$(echo "$ROLES_INPUT" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          # Each role is split into shards that build in parallel (public repo: max 20 concurrent jobs).
          MATRIX=$(echo "$ROLES_JSON" | jq -c '{include: [.[] as $r
            | ({"companion":10,"repeater":5,"room-server":5}[$r] // 4) as $n
            | range(0; $n) | {role: $r, shard: ., shards: $n}]}')
          SHA=$(gh api "repos/${REPO}/commits/${BRANCH}" --jq '.sha')
          SHA7="${SHA:0:7}"
          DATE=$(date -u +%Y%m%d)
          TS=$(date -u +"%Y-%m-%d %H:%M")
          {
            echo "upstream_repo=$REPO"
            echo "upstream_branch=$BRANCH"
            echo "upstream_sha=$SHA"
            echo "upstream_sha7=$SHA7"
            echo "pr_list=$PRS"
            echo "retention=$RET"
            echo "roles=$ROLES_JSON"
            echo "matrix=$MATRIX"
            echo "run_date=$DATE"
            echo "run_ts=$TS"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: repo=$REPO branch=$BRANCH sha=$SHA roles=$ROLES_JSON prs=$PRS retention=$RET"

  build:
    name: build (${{ matrix.role }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout config
        uses: actions/checkout@v5
        with:
          path: config

      - name: Checkout upstream
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.prepare.outputs.upstream_repo }}
          ref: ${{ needs.prepare.outputs.upstream_branch }}
          path: src
          fetch-depth: 0

      - name: Configure git in upstream checkout
        working-directory: src
        run: |
          git config user.email "actions@github.com"
          git config user.name "nightly-builder"

      - name: Apply extra PRs
        id: prs
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream_repo }}
          PR_LIST: ${{ needs.prepare.outputs.pr_list }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          mkdir -p ../pr-status
          STATUS="../pr-status/${ROLE}.json"
          echo '[]' > "$STATUS"
          echo "$PR_LIST" | jq -r '.[]' | while read -r n; do
            [ -z "$n" ] && continue
            TITLE=$(gh pr view "$n" --repo "$UPSTREAM" --json title --jq '.title' 2>/dev/null || true)
            if [ -z "$TITLE" ]; then
              jq --argjson n "$n" --arg s "fetch_fail" --arg t "" \
                 '. += [{"number":$n,"title":$t,"status":$s}]' "$STATUS" > "$STATUS.tmp"
              mv "$STATUS.tmp" "$STATUS"
              echo "PR #$n: fetch failed"
              continue
            fi
            if git fetch origin "pull/${n}/head:pr-${n}" >/dev/null 2>&1 \
               && git merge --no-edit "pr-${n}" >/dev/null 2>&1; then
              jq --argjson n "$n" --arg s "merged" --arg t "$TITLE" \
                 '. += [{"number":$n,"title":$t,"status":$s}]' "$STATUS" > "$STATUS.tmp"
              mv "$STATUS.tmp" "$STATUS"
              echo "PR #$n merged: $TITLE"
            else
              git merge --abort >/dev/null 2>&1 || true
              jq --argjson n "$n" --arg s "conflict" --arg t "$TITLE" \
                 '. += [{"number":$n,"title":$t,"status":$s}]' "$STATUS" > "$STATUS.tmp"
              mv "$STATUS.tmp" "$STATUS"
              echo "PR #$n conflict: $TITLE"
            fi
          done
          cat "$STATUS"

      # ~/.platformio (toolchains, platforms, download cache) is identical across all
      # three roles, so we share a single cache key. Total ~5 GiB.
      - name: Cache PlatformIO packages and platforms
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: pio-pkg-${{ hashFiles('src/platformio.ini', 'src/variants/**/platformio.ini', 'src/library.json') }}
          restore-keys: |
            pio-pkg-

      - name: Setup build environment
        uses: ./src/.github/actions/setup-build-environment

      - name: Build firmwares
        working-directory: src
        env:
          FIRMWARE_VERSION: nightly-${{ needs.prepare.outputs.run_date }}-${{ needs.prepare.outputs.upstream_sha7 }}
          ROLE: ${{ matrix.role }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          set -euo pipefail
          case "$ROLE" in
            companion)
              mapfile -t ALL < <(bash build.sh list | grep -E "_companion_radio_(usb|ble)$" | sort)
              ;;
            repeater)
              mapfile -t ALL < <(bash build.sh list | grep -E "_repeater$" | sort)
              ;;
            room-server)
              mapfile -t ALL < <(bash build.sh list | grep -E "_room_server$" | sort)
              ;;
            *)
              echo "Unknown role: $ROLE" >&2; exit 1 ;;
          esac
          if [ ${#ALL[@]} -eq 0 ]; then
            echo "No envs matched for role=$ROLE" >&2; exit 1
          fi
          # Round-robin split so similar boards (alphabetical families) spread across shards.
          ENVS=()
          for i in "${!ALL[@]}"; do
            [ $((i % SHARDS)) -eq "$SHARD" ] && ENVS+=("${ALL[$i]}")
          done
          TOTAL=${#ENVS[@]}
          # build.sh wipes ./out at every invocation, so collect outputs in a sibling dir.
          # One broken upstream env must not sink the whole role: record it and keep going.
          SHARD_DIR="$(pwd)/../shard-out"
          rm -rf "$SHARD_DIR"
          mkdir -p "$SHARD_DIR/firmware"
          printf '%s\n' "${ENVS[@]}" > "$SHARD_DIR/envs.txt"
          : > "$SHARD_DIR/failed.txt"
          FAILED=0
          echo "Shard $SHARD/$SHARDS: building $TOTAL of ${#ALL[@]} envs for role=$ROLE"
          for i in "${!ENVS[@]}"; do
            IDX=$((i+1))
            ENV="${ENVS[$i]}"
            echo "::group::[$IDX/$TOTAL] $ENV"
            if ! bash build.sh build-firmware "$ENV"; then
              FAILED=$((FAILED+1))
              echo "$ENV" >> "$SHARD_DIR/failed.txt"
              echo "::endgroup::"
              echo "::warning title=Build failed::$ENV failed to build (skipped)"
              continue
            fi
            if [ -d out ]; then
              shopt -s nullglob dotglob
              files=(out/*)
              shopt -u dotglob
              if [ ${#files[@]} -gt 0 ]; then
                cp -- "${files[@]}" "$SHARD_DIR/firmware/"
              fi
            fi
            echo "::endgroup::"
          done
          echo "Built $((TOTAL - FAILED))/$TOTAL firmwares; $(ls "$SHARD_DIR/firmware" | wc -l) files"

      - name: Upload shard firmwares
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.role }}-${{ matrix.shard }}
          path: shard-out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload PR status
        if: ${{ matrix.shard == 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-status-${{ matrix.role }}
          path: pr-status/${{ matrix.role }}.json
          if-no-files-found: error

  # Collect all shards of a role into one release.
  release:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.prepare.outputs.roles) }}
    steps:
      - name: Download shard firmwares
        uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: fw-${{ matrix.role }}-*

      - name: Download PR status
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-status-${{ matrix.role }}
          path: pr-status

      - name: Merge shards
        env:
          ROLE: ${{ matrix.role }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          set -euo pipefail
          EXPECTED=$(echo "$MATRIX" | jq --arg r "$ROLE" '[.include[] | select(.role == $r)] | length')
          mkdir -p out shards
          : > failed.txt
          : > missing-shards.txt
          TOTAL=0
          for k in $(seq 0 $((EXPECTED - 1))); do
            d="shards/fw-${ROLE}-${k}"
            if [ ! -f "$d/envs.txt" ]; then
              echo "$k" >> missing-shards.txt
              continue
            fi
            TOTAL=$((TOTAL + $(grep -c . "$d/envs.txt" || true)))
            cat "$d/failed.txt" >> failed.txt
            shopt -s nullglob
            files=("$d"/firmware/*)
            [ ${#files[@]} -gt 0 ] && mv -- "${files[@]}" out/
          done
          sort -o failed.txt failed.txt
          NFAILED=$(grep -c . failed.txt || true)
          NMISSING=$(grep -c . missing-shards.txt || true)
          echo "role=$ROLE: $((TOTAL - NFAILED))/$TOTAL envs built, $NMISSING of $EXPECTED shards missing, $(ls out | wc -l) files"
          {
            echo "### ${ROLE}: $((TOTAL - NFAILED))/$TOTAL envs built"
            [ "$NFAILED" -gt 0 ] && sed 's/^/- failed: `/; s/$/`/' failed.txt
            [ "$NMISSING" -gt 0 ] && echo "- **$NMISSING of $EXPECTED shards did not finish** (their boards are missing)"
            true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(ls out | wc -l)" -eq 0 ]; then
            echo "No firmware produced for role=$ROLE" >&2; exit 1
          fi

      - name: Build release body
        if: ${{ inputs.dry_run != true }}
        env:
          UPSTREAM: ${{ needs.prepare.outputs.upstream_repo }}
          BRANCH: ${{ needs.prepare.outputs.upstream_branch }}
          SHA: ${{ needs.prepare.outputs.upstream_sha }}
          TS: ${{ needs.prepare.outputs.run_ts }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          STATUS="pr-status/${ROLE}.json"
          mkdir -p pr-status
          [ -f "$STATUS" ] || echo '[]' > "$STATUS"
          {
            echo "Upstream: ${UPSTREAM}@${SHA} (${BRANCH})"
            echo "Built: ${TS} UTC"
            echo
            MERGED=$(jq -r '[.[] | select(.status=="merged")] | length' "$STATUS")
            if [ "$MERGED" -gt 0 ]; then
              echo "Merged PRs:"
              jq -r '.[] | select(.status=="merged") | "- #\(.number) \(.title)"' "$STATUS"
              echo
            fi
            SKIPPED=$(jq -r '[.[] | select(.status!="merged")] | length' "$STATUS")
            if [ "$SKIPPED" -gt 0 ]; then
              echo "Skipped PRs:"
              jq -r '.[] | select(.status!="merged") | "- #\(.number) \(.title) — \(.status | sub("_"; " "))"' "$STATUS"
              echo
            fi
            if [ -s failed.txt ]; then
              echo "Failed to build (not attached):"
              sed 's/^/- /' failed.txt
              echo
            fi
            if [ -s missing-shards.txt ]; then
              echo "Warning: $(grep -c . missing-shards.txt) build shard(s) did not finish; some boards are missing."
              echo
            fi
            echo "Firmware artifacts attached below."
          } > release-body.md
          cat release-body.md

      - name: Create release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROLE: ${{ matrix.role }}
          DATE: ${{ needs.prepare.outputs.run_date }}
          SHA7: ${{ needs.prepare.outputs.upstream_sha7 }}
        run: |
          set -euo pipefail
          TAG="nightly-${ROLE}-${DATE}"
          NAME="Nightly ${ROLE} ${DATE} (${SHA7})"

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Existing release for $TAG found; deleting before recreate."
            gh release delete "$TAG" -R "$REPO" --cleanup-tag --yes
          fi

          shopt -s nullglob
          ARTIFACTS=(out/*)
          gh release create "$TAG" "${ARTIFACTS[@]}" \
            -R "$REPO" \
            --title "$NAME" \
            --notes-file release-body.md \
            --target main \
            --prerelease
  prune:
    needs: [prepare, release]
    if: ${{ always() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Prune old nightly releases per role
        env:
          GH_TOKEN: ${{ github.token }}
          RET: ${{ needs.prepare.outputs.retention }}
        run: |
          set -euo pipefail
          for role in companion repeater room-server; do
            echo "Pruning role=$role keep=$RET"
            gh release list -R "$GITHUB_REPOSITORY" -L 200 --json tagName,createdAt,isPrerelease \
              | jq -r --arg p "nightly-${role}-" --argjson keep "$RET" '
                  [.[] | select(.tagName | startswith($p))]
                  | sort_by(.createdAt) | reverse
                  | .[$keep:]
                  | .[].tagName
                ' \
              | while read -r tag; do
                  [ -z "$tag" ] && continue
                  echo "Deleting $tag"
                  gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes || \
                    echo "Failed to delete $tag (continuing)"
                done
          done

  update-readme:
    needs: [prepare, release, prune]
    if: ${{ always() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download PR status artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pr-status-*
          merge-multiple: false

      - name: Build auto-section
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream_repo }}
          BRANCH: ${{ needs.prepare.outputs.upstream_branch }}
          SHA: ${{ needs.prepare.outputs.upstream_sha }}
          SHA7: ${{ needs.prepare.outputs.upstream_sha7 }}
          DATE: ${{ needs.prepare.outputs.run_date }}
          TS: ${{ needs.prepare.outputs.run_ts }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          status_for() {
            local role="$1"
            local tag="nightly-${role}-${DATE}"
            if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
              echo "[ok](https://github.com/${REPO}/releases/tag/${tag})"
            else
              echo "failed"
            fi
          }

          {
            echo "<!-- BEGIN AUTO -->"
            echo
            echo "## Latest build"
            echo
            echo "- **Date (UTC):** ${TS}"
            echo "- **Upstream:** [\`${SHA7}\`](https://github.com/${UPSTREAM}/commit/${SHA}) on [\`${BRANCH}\`](https://github.com/${UPSTREAM}/tree/${BRANCH})"
            echo "- **Companion:** $(status_for companion)"
            echo "- **Repeater:** $(status_for repeater)"
            echo "- **Room server:** $(status_for room-server)"
            echo

            echo "## Recent builds"
            echo
            echo "| Date | Companion | Repeater | Room server |"
            echo "|------|-----------|----------|-------------|"
            ALL_TAGS=$(gh release list -R "$REPO" -L 200 --json tagName --jq '.[].tagName')
            DATES=$(echo "$ALL_TAGS" \
              | grep -E '^nightly-(companion|repeater|room-server)-[0-9]{8}$' \
              | sed -E 's/^nightly-(companion|repeater|room-server)-([0-9]{8})$/\2/' \
              | sort -u | sort -r | head -7)
            for d in $DATES; do
              row="| ${d:0:4}-${d:4:2}-${d:6:2} |"
              for role in companion repeater room-server; do
                tag="nightly-${role}-${d}"
                if echo "$ALL_TAGS" | grep -qx "$tag"; then
                  row="$row [ok](https://github.com/${REPO}/releases/tag/${tag}) |"
                else
                  row="$row failed |"
                fi
              done
              echo "$row"
            done
            echo

            STATUS_FILE=""
            for f in artifacts/pr-status-*/*.json; do
              [ -f "$f" ] && STATUS_FILE="$f" && break
            done
            if [ -n "$STATUS_FILE" ] && [ "$(jq 'length' "$STATUS_FILE")" -gt 0 ]; then
              echo "## Configured PRs"
              echo
              jq -r --arg up "$UPSTREAM" '
                .[] |
                "- [#\(.number)](https://github.com/\($up)/pull/\(.number)) \(.title) — " +
                  (if .status == "merged" then "merged"
                   elif .status == "conflict" then "conflict"
                   else "fetch fail" end)
              ' "$STATUS_FILE"
              echo
            fi

            echo "<!-- END AUTO -->"
          } > auto.md

          awk '
            /<!-- BEGIN AUTO -->/ {
              while ((getline line < "auto.md") > 0) print line
              close("auto.md")
              inblock = 1
              next
            }
            /<!-- END AUTO -->/ && inblock {
              inblock = 0
              next
            }
            !inblock { print }
          ' README.md > README.new
          mv README.new README.md
          rm -f auto.md

      - name: Commit README if changed
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet README.md; then
            echo "README unchanged"
            exit 0
          fi
          git add README.md
          git commit -m "Update nightly status [skip ci]"
          git push

  # Keep the Actions tab clean: delete every finished run (all workflows) except this one.
  cleanup-runs:
    needs: [prepare, build, release, prune, update-readme]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ github.run_id }}
        run: |
          set -euo pipefail
          IDS=$(gh api --paginate "repos/${REPO}/actions/runs?status=completed&per_page=100" \
                  --jq ".workflow_runs[] | select(.id != ${CURRENT}) | .id")
          COUNT=0
          for id in $IDS; do
            if gh api -X DELETE "repos/${REPO}/actions/runs/${id}" >/dev/null; then
              COUNT=$((COUNT+1))
            else
              echo "Failed to delete run $id (continuing)"
            fi
          done
          echo "Deleted $COUNT old workflow runs"
